name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: tree
        shell: cmd
        run: dir /s /b

      - name: build
        shell: cmd
        run: |
          set SRC=.
          if exist robrun\robrun.cpp set SRC=robrun
          if exist inject.cpp (set INJ=inject.cpp) else (set INJ=%SRC%\inject.cpp)
          cl /nologo /std:c++20 /O2 /MT /EHsc /DROBRUN_INTERNAL=0 %SRC%\robrun.cpp /Fe:robrun.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib
          cl /nologo /std:c++20 /O2 /MT /EHa /DROBRUN_INTERNAL=1 %SRC%\robrun.cpp /LD /Fe:robrun.dll /link user32.lib gdi32.lib
          cl /nologo /std:c++20 /O2 /MT %INJ% /Fe:inject.exe

      - uses: actions/upload-artifact@v4
        with:
          name: robrun
          path: |
            robrun.exe
            robrun.dll
            inject.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            robrun.exe
            robrun.dll
            inject.exe
